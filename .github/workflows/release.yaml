name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        with:
          runtime: node@26
      - run: pnpm prepack
      - run: pnpm --filter @standard-config/oxlint stage publish --access=public --provenance
      - run: pnpm --filter @standard-config/oxlint-react stage publish --access=public --provenance
      - run: pnpm --filter @standard-config/oxlint-stylistic stage publish --access=public --provenance
