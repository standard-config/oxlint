packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@eslint-react/eslint-plugin': ^5.20.2
  '@standard-config/tsconfig': ^3.2.0
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^24.13.6
  eslint-plugin-perfectionist: ^5.11.1
  eslint-plugin-react-you-might-not-need-an-effect: ^1.0.2
  oxlint: ^1.85.0
  oxlint-tsgolint: ^7.0.2002
  publint: ^0.3.24
  typescript: ^6.0.3
  vite-plus: ^0.3.3

color: always

gitChecks: false

engineStrict: true

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@standard-config/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade
