packages:
  - packages/*

autoDedupe: true

autoInstallPeers: false

catalog:
  '@eslint-react/eslint-plugin': ^5.30.6
  '@standard-config/tsconfig': ^3.2.0
  '@stylistic/eslint-plugin': ^6.0.1
  '@types/node': ^26.6.6
  eslint-plugin-perfectionist: ^5.14.0
  eslint-plugin-react-you-might-not-need-an-effect: ^1.3.1
  oxlint: ^1.95.0
  publint: ^0.3.25
  tsrs: ^7.1.0-beta.tsrs5
  typescript: ^6.0.3
  vite-plus: ^1.7.0

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - '@standard-config/*'
  - '@tsrs/*'
  - oxlint
  - tsrs

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>tsrs: 'catalog:'

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs
