autoInstallPeers: false

catalog:
  oxlint: ^1.56.0
  oxlint-tsgolint: ^0.17.1

onlyBuiltDependencies:
  - esbuild

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'

peerDependencyRules:
  allowedVersions:
    eslint: '*'
    vitest: '*'

strictPeerDependencies: true

updateConfig:
  ignoreDependencies:
    - '@types/node'
