packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.1.0
  '@types/node': ^22.19.18
  oxlint: ^1.63.0
  oxlint-tsgolint: ^0.22.1
  publint: ^0.3.20
  typescript: ^6.0.3
  vite-plus: ^0.1.20
  vitest: ^4.1.6

color: always

gitChecks: false

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  '@types/node>undici-types': '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: '-'
  vite-plus>oxlint-tsgolint: '-'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
