packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.3
  oxlint: ^1.73.0
  oxlint-tsgolint: ^0.24.0
  publint: ^0.3.21
  typescript: ^6.0.3
  vite-plus: ^0.2.4

color: always

gitChecks: false

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@standard-config/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
