packages:
  - packages/*

autoInstallPeers: false

blockExoticSubdeps: true

catalog:
  '@standard-config/tsconfig': ^3.1.0
  oxlint: ^1.61.0
  oxlint-tsgolint: ^0.21.1
  publint: ^0.3.18
  typescript: ^6.0.3
  vite-plus: ^0.1.19
  vitest: ^4.1.4

color: always

gitChecks: false

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: '-'
  vite-plus>oxlint-tsgolint: '-'

peerDependencyRules:
  allowAny:
    - vitest

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
