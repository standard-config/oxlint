packages:
  - packages/*

autoDedupe: true

autoInstallPeers: false

catalog:
  '@eslint-react/eslint-plugin': ^5.30.2
  '@standard-config/tsconfig': ^3.2.0
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^26.6.6
  eslint-plugin-perfectionist: ^5.13.0
  eslint-plugin-react-you-might-not-need-an-effect: ^1.2.0
  oxlint: ^1.93.0
  oxlint-tsgolint: ^7.0.2007
  publint: ^0.3.25
  typescript: ^6.0.3
  vite-plus: ^1.6.0

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@standard-config/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1

peerDependencyRules:
  allowAny:
    - typescript
    - vite
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade
