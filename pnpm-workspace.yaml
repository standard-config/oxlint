packages:
  - packages/*

autoInstallPeers: false

blockExoticSubdeps: true

catalog:
  '@standard-config/tsconfig': ^3.1.0
  oxlint: ^1.60.0
  oxlint-tsgolint: ^0.20.0
  publint: ^0.3.18
  typescript: ^6.0.2
  vite-plus: ^0.1.16
  vitest: ^4.1.4

color: always

gitChecks: false

overrides:
  '@prettier/plugin-oxc>oxc-parser': '*'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'

peerDependencyRules:
  allowAny:
    - vitest

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
