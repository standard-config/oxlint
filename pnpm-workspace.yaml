packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.1.0
  '@types/node': ^22.19.19
  oxlint: ^1.67.0
  oxlint-tsgolint: ^0.23.0
  publint: ^0.3.21
  typescript: ^6.0.3
  vite-plus: ^0.1.23
  vitest: ^4.1.7

color: always

gitChecks: false

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  '@types/node>undici-types': '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: '-'
  vite-plus>oxlint-tsgolint: '-'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - ast-v8-to-istanbul@1.0.2
  - tinyexec@1.2.2

updateConfig:
  ignoreDependencies:
    - '@types/node'
