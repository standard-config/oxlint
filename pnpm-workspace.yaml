packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@eslint-react/eslint-plugin': ^5.18.6
  '@standard-config/tsconfig': ^3.2.0
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^24.13.3
  eslint-plugin-perfectionist: ^5.11.0
  eslint-plugin-react-you-might-not-need-an-effect: ^1.0.2
  oxlint: ^1.81.0
  oxlint-tsgolint: ^7.0.2001
  publint: ^0.3.24
  typescript: ^6.0.3
  vite-plus: ^0.3.0

color: always

gitChecks: false

engineStrict: true

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@standard-config/*'
  - oxlint
  - oxlint-tsgolint

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'
  vite-plus>oxlint-tsgolint: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'

strictPeerDependencies: true

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - '@types/node'
