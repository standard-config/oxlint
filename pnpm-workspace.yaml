packages:
  - packages/*

autoInstallPeers: false

catalog:
  '@standard-config/tsconfig': ^3.2.0
  '@types/node': ^24.13.2
  oxlint: ^1.70.0
  oxlint-tsgolint: ^0.23.0
  publint: ^0.3.21
  typescript: ^6.0.3
  vite-plus: ^0.1.24
  vitest: ^4.1.9

color: always

gitChecks: false

minimumReleaseAgeExclude:
  - '@oxlint/*'
  - eslint-plugin-perfectionist
  - oxlint
  - oxlint-tsgolint

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: '-'
  vite-plus>oxlint-tsgolint: '-'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
